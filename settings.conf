# Settings for scan-ip.sh. Edit in any text editor -- Notepad is fine.
#
# One setting per line, name = value. Anything after # is a comment.
# A line you leave out just keeps its default.
# Anything given on the command line wins over what is written here.

# ---------- what to call this network ----------
# Results are stored per network, because an address that is fast on one
# carrier can be throttled on another. Give each network its own name.
label = unlabelled

# ---------- how much to look at ----------
# Random addresses drawn from each range in the first, cheap pass.
sample = 40

# How many working addresses to find. Addresses that answer but carry no
# traffic are skipped and the next candidate is tried instead, so this is a
# count of usable results rather than of attempts. It is the slow part, so
# raising it costs real time.
top = 15

# Repeats per address. One measurement on a mobile line is mostly noise.
trials = 2

# Bytes fetched per trial. Smaller is faster but noisier; too large and a slow
# line runs past the timeout and looks blocked when it is only slow.
size = 200000

# How many probes run at once in the first pass. Only that pass -- it is a
# bare TCP connect and takes crowding well. The check that follows is a full
# TLS request and does not, so it caps itself much lower no matter what is set
# here. Run at 100 on a mobile line it starved itself and reported that not a
# single address served the test host.
parallel = 40

# ---------- the bar an address has to clear ----------
# By default the line itself is measured first and the bar is set to a share
# of what it managed. That is what makes a threshold mean anything: 200 kB/s
# is a good result on one connection and a failure on another.
#
# share = how much of the line's own speed an address has to reach, in percent.
share = 60

# Set either of these to a number to fix the bar yourself instead, in
# kilobytes per second. Doing so switches the automatic bar off: the line is
# still measured once, so you can see it was tested and roughly what it did,
# but the figure is only reported. It never overrides your number and never
# stops the scan -- one sample down one path is no reason to refuse the bar
# you chose.
# min_speed  = 100
# min_upload = 1000

# What to measure: download, upload, or both.
#
#   download   the default. Fastest, and what most people care about.
#   upload     only upload. Nothing is downloaded and an address is judged
#              purely on how fast it sends.
#   both       both numbers, and an address has to clear both bars. Takes
#              about twice as long as either on its own.
measure = download

# Turn the automatic measurement off without setting a bar of your own,
# so every address that carries data is reported.
# auto = no

# Drop addresses whose TCP handshake is slower than this many milliseconds,
# before the speed test rather than after. Left out, nothing is dropped.
# Careful: set it below what the network can actually do and everything is
# filtered out. Run once without it and look at the times first.
# max_latency = 800

# ---------- which config the address scan runs through ----------
# The address scan has its own sample config, kept apart from the fragment
# scanner's working.json so changing one never disturbs the other. Each
# candidate address is dropped into this config's address field and the speed
# is measured through the tunnel, which is the number your users actually get.
config = ip.json

# Measure the plain Cloudflare edge instead, with no tunnel at all. Faster,
# and the only thing that works when the config's domain is filtered -- there
# the block is on the name, so every address fails the same way and the scan
# separates nothing.
# direct = yes

# ---------- what to measure against ----------
# A host on Cloudflare that nobody filters. The address under test is pinned
# while this name stays put, so only the edge changes.
host = speed.cloudflare.com
down_path = /__down?bytes=
up_path = /__up

# Some networks block speed.cloudflare.com by name. That looks exactly like
# every address being dead -- connections open on 443 and no TLS request ever
# completes -- so run check-host.sh on that network and it will tell you which
# names do answer, and what to put here.
#
# Only speed.cloudflare.com offers somewhere to upload to. With any other host,
# down_path is a normal page, up_path should be set to - and measure has to be
# download.

# ---------- files ----------
# One CIDR per line. Comments and blank lines are ignored.
ranges_file = ranges.txt

# Results are appended here, one row per address.
out = ips.csv
